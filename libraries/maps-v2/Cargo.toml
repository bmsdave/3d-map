[workspace]
members = [
    "crates/maps2-units",
    "crates/maps2-camera",
    "crates/maps2-tile",
    "crates/maps2-style",
    "crates/maps2-text",
    "crates/maps2-fixtures",
    "crates/maps2-render",
    "crates/maps2-web",
    "crates/maps2-ingest",
]
resolver = "2"

[workspace.dependencies]
num-traits = "0.2"
sha2 = "0.10"
miniz_oxide = "0.8"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window","Performance","Document","Element","HtmlCanvasElement","WebGl2RenderingContext","WebGlBuffer","WebGlProgram","WebGlTexture","WebGlShader","WebGlUniformLocation","WebGlVertexArrayObject"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
