[package]
name = "maps2-ingest"
version = "0.1.0-alpha"
edition = "2024"
description = "Reproducible OSM and DEM ingestion for Maps SDK v2"
license = "MIT"

[dependencies]
maps2-style = { path = "../maps2-style" }
maps2-tile = { path = "../maps2-tile" }
maps2-units = { path = "../maps2-units" }
num-traits = "0.2"
# Deflate for the spool's scratch shards; already in the workspace lock.
miniz_oxide = "0.9"
osmpbfreader = "0.19.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
toml = "0.9"
tiff = "0.11.3"
shapefile = "0.9.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
