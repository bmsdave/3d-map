[package]
name = "maps2-ingest"
version = "0.1.0-alpha"
edition = "2024"
description = "Reproducible OSM and DEM ingestion for Maps SDK v2"
license = "MIT"

[dependencies]
maps2-style = { path = "../maps2-style" }
maps2-tile = { path = "../maps2-tile" }
maps2-units = { path = "../maps2-units" }
osmpbfreader = "0.19.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"

[lints]
workspace = true
