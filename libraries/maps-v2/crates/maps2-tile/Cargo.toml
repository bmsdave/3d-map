[package]
name = "maps2-tile"
version = "0.1.0-alpha"
edition = "2024"
description = "Binary tile format and zero-copy reading for the Maps SDK v2"
license = "MIT"

[dependencies]
# Deflate for the packed heights section. Pure Rust, so it builds for
# wasm32 exactly like the rest of the crate does, and already in the
# workspace lock through the ingest pipeline's readers.
miniz_oxide = { workspace = true }
maps2-units = { path = "../maps2-units" }
num-traits = "0.2"

[lints]
workspace = true
