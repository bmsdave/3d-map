[package]
name = "maps2-web"
version = "0.1.0-alpha"
edition = "2024"
description = "wasm-bindgen surface and WebGL2 renderer of the Maps SDK v2"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
maps2-units = { path = "../maps2-units" }
maps2-camera = { path = "../maps2-camera" }
maps2-tile = { path = "../maps2-tile" }
maps2-style = { path = "../maps2-style" }
maps2-render = { path = "../maps2-render" }
maps2-text = { path = "../maps2-text" }
num-traits = "0.2"

[dev-dependencies]
maps2-fixtures = { path = "../maps2-fixtures" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Performance",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlTexture",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }

[lints]
workspace = true
